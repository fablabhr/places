<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 82 82" width="82" height="82">
  <!-- Fablab mark: compact circuit node -->
  <g transform="translate(41,41)">
    <circle r="28" fill="none" stroke="#209F93" stroke-width="3"/>
    <circle r="13" fill="#103B37"/>
    <!-- Connectors -->
    <line x1="-28" y1="0" x2="-13" y2="0" stroke="#209F93" stroke-width="2.5"/>
    <line x1="13" y1="0" x2="28" y2="0" stroke="#209F93" stroke-width="2.5"/>
    <line x1="0" y1="-28" x2="0" y2="-13" stroke="#209F93" stroke-width="2.5"/>
    <line x1="0" y1="13" x2="0" y2="28" stroke="#209F93" stroke-width="2.5"/>
    <!-- Corner dots -->
    <circle cx="-20" cy="-20" r="3" fill="#209F93"/>
    <circle cx="20" cy="-20" r="3" fill="#209F93"/>
    <circle cx="20" cy="20" r="3" fill="#209F93"/>
    <circle cx="-20" cy="20" r="3" fill="#209F93"/>
    <!-- Centre dot -->
    <circle r="4" fill="#209F93"/>
