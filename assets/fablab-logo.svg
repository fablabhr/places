<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 247" width="247" height="247">
  <!-- Fablab logo mark: geometric hexagon / circuit node mark + wordmark -->
  <g transform="translate(123.5,90)">
    <!-- Outer ring -->
    <circle r="58" fill="none" stroke="#209F93" stroke-width="4"/>
    <!-- Inner circle -->
    <circle r="28" fill="#103B37"/>
    <!-- Cross connectors -->
    <line x1="-58" y1="0" x2="-28" y2="0" stroke="#209F93" stroke-width="3"/>
    <line x1="28" y1="0" x2="58" y2="0" stroke="#209F93" stroke-width="3"/>
    <line x1="0" y1="-58" x2="0" y2="-28" stroke="#209F93" stroke-width="3"/>
    <line x1="0" y1="28" x2="0" y2="58" stroke="#209F93" stroke-width="3"/>
    <!-- Corner dots -->
    <circle cx="-41" cy="-41" r="5" fill="#209F93"/>
    <circle cx="41" cy="-41" r="5" fill="#209F93"/>
    <circle cx="41" cy="41" r="5" fill="#209F93"/>
    <circle cx="-41" cy="41" r="5" fill="#209F93"/>
    <!-- Centre dot -->
    <circle r="8" fill="#209F93"/>
  </g>
  <!-- Wordmark -->
  <text x="123.5" y="182" font-family="'Space Grotesk', 'IBM Plex Sans', sans-serif" font-size="28" font-weight="700" letter-spacing="6" text-anchor="middle" fill="#103B37">FABLAB</text>
  <text x="123.5" y="204" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="3" text-anchor="middle" fill="#8F897D">fablab.hr</text>
</svg>
