<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 210" width="210" height="210">
  <!-- Fablab isometric cube logo -->
  <!-- Flat-top hexagon, R=90, center=(105,105) -->
  <!-- Vertices: V0=right, V1=top-right, V2=top-left, V3=left, V4=bottom-left, V5=bottom-right -->
  <!-- Top face (teal):       V2→V1→V0→C -->
  <polygon points="60,27 150,27 195,105 105,105" fill="#3DAB9E"/>
  <!-- Left face (maroon):    V4→V3→V2→C -->
  <polygon points="60,183 15,105 60,27 105,105" fill="#833452"/>
  <!-- Right face (dark blue-teal): V0→V5→V4→C -->
  <polygon points="195,105 150,183 60,183 105,105" fill="#1D6278"/>
</svg>
